name: personal_finance_tracker
description: "Personal finance tracking app using Google Drive & Google Sheets as backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Sign-In & APIs
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.1

  # Local storage for metadata
  shared_preferences: ^2.2.3

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  characters: ^1.3.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2
  share_plus: ^10.0.3

  # Excel import (read external .xlsx workbooks) & file picking
  excel: ^4.0.6
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png